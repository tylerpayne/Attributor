[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unsquash"
version = "0.1.0"
description = "Unsquashed attention rollout: de-biased attention attribution, its HotpotQA evaluation harness, and continued-pretraining retrofit with the log-distance prior"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["unsquash*"]
